# Runs the metric and data-loading tests on every push (no models needed).
name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install "numpy<2" pandas pillow pyyaml requests rdkit pytest
      - run: pytest -q
